<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f1ebdc"><title>Rooftop Rumble · Afterclass Garage</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="basketball.css"></head>
<body><main id="game" aria-label="Rooftop Rumble basketball"><canvas id="court" aria-label="Basketball court. Hold your key or side of the court to jump and raise your arm. Release to shoot."></canvas>
<a class="home" href="index.html" aria-label="Back to Afterclass Garage">↝ <span>GARAGE</span></a>

<button id="pause" class="menu-button" aria-label="Pause and open menu"><span aria-hidden="true">☰</span></button>
<div id="round-message" aria-live="polite" hidden></div>
<div id="touch-controls" aria-label="Hold and release controls"></div>
