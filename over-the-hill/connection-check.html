<!doctype html><html lang="en"><meta charset="utf-8"><title>Shared world connection check</title><style>body{font:16px/1.6 system-ui;background:#f3eddd;color:#283e35;padding:30px}pre{white-space:pre-wrap}</style><h1>Shared world connection check</h1><pre id="result">Checking the live world…</pre><a href="./">Back to the game</a><script>
(async()=>{const log=[],tokens=[];const post=async(p,b)=>{const r=await fetch('api/'+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const data=await r.json();if(!r.ok)throw Error(p+': HTTP '+r.status+' '+JSON.stringify(data));return data;};try{const a=await post('join',{}),b=await post('join',{});tokens.push(a.token,b.token);log.push('Two independent player sessions joined: PASS');for(let i=0;i<12;i++){await post('input',{token:a.token,input:{up:true}});await post('input',{token:b.token,input:{brake:true},park:true});await new Promise(r=>setTimeout(r,90));}const r=await fetch('api/snapshot?token='+b.token),snapshot=await r.json(),moving=snapshot.players.find(p=>p.id===a.id);if(!moving||!snapshot.players.some(p=>p.id===b.id))throw Error('Snapshot missing a player');const distance=moving.car.z-a.car.z;if(distance<.2)throw Error('Vehicle did not move');log.push('Shared snapshot includes both players: PASS','Server-simulated forward movement: PASS ('+distance.toFixed(2)+' metres)');await post('input',{token:a.token,input:{brake:true},park:true});const again=await post('join',{token:a.token});if(again.id!==a.id)throw Error('Reconnect identity changed');log.push('Reconnect identity and saved position: PASS','RESULT: PASS');}catch(e){log.push('RESULT: FAIL — '+e.message);}finally{for(const token of tokens)try{await post('input',{token,input:{brake:true},park:true});}catch{}document.querySelector('#result').textContent=log.join('\n');}})();
</script></html>
