<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shared world connection check</title><style>body{font:16px/1.6 system-ui;background:#f3eddd;color:#283e35;padding:30px;max-width:800px;margin:auto}pre{white-space:pre-wrap}</style><h1>Shared world connection check</h1><pre id="result" aria-live="polite">Checking the live world…</pre><a href="./">Back to the game</a><script>
(async()=>{const log=[],tokens=[],wait=ms=>new Promise(r=>setTimeout(r,ms));const post=async(p,b)=>{const r=await fetch('api/'+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const data=await r.json();if(!r.ok)throw Error(p+': HTTP '+r.status+' '+JSON.stringify(data));return data;};try{const a=await post('join',{});tokens.push(a.token);const b=await post('join',{});tokens.push(b.token);if(a.world!==b.world||a.world!=='ashen-vale-watershed-2')throw Error('World version mismatch');if(Math.hypot(a.car.x-b.car.x,a.car.z-b.car.z)<5.5)throw Error('Arrival staging overlaps');log.push('Two independent sessions in the fixed shared world: PASS','Safe trailhead staging: PASS');let snapshot;for(let i=0;i<14;i++){snapshot=await post('input',{token:a.token,input:{up:i<8,parking:i>=8}});await post('input',{token:b.token,input:{parking:true}});await wait(90);}const moving=snapshot.players.find(p=>p.id===a.id);if(!moving||!snapshot.players.some(p=>p.id===b.id))throw Error('Snapshot missing a player');const distance=Math.hypot(moving.car.x-a.car.x,moving.car.z-a.car.z);if(distance<.2)throw Error('Vehicle did not move');if(!moving.car.q?.every(Number.isFinite)||moving.car.wheels.length!==4)throw Error('Missing rigid-body/wheel state');log.push('Shared rigid-body snapshot and server-simulated motion: PASS ('+distance.toFixed(2)+' m)');await post('input',{token:a.token,input:{parking:true,brake:true}});const again=await post('join',{token:a.token});if(again.id!==a.id)throw Error('Reconnect identity changed');log.push('Reconnect identity: PASS','RESULT: PASS');}catch(e){log.push('RESULT: FAIL — '+e.message);}finally{for(const token of tokens)try{await post('leave',{token});}catch{}document.querySelector('#result').textContent=log.join('\n');}})();
</script></html>
