services:
  chroma:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 8787
      CHROMA_DATA_DIR: /data
    expose:
      - "8787"
    volumes:
      - chroma-data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - chroma
    environment:
      CHROMA_DOMAIN: ${CHROMA_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  chroma-data:
    name: chroma-data
  caddy-data:
  caddy-config:
